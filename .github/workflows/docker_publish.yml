name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USER_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_USER_PASSWORD }}

      - name: Extract version and resolve image tags
        id: resolve_tags
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION=$(grep '\- Version ' mysqltuner.pl | awk '{ print $NF}')
          IMAGE="jmrenouard/mysqltuner"
          TAGS="${IMAGE}:${VERSION},${IMAGE}:v${VERSION}"
          if [ "$IS_PRERELEASE" != "true" ]; then
            TAGS="${IMAGE}:latest,${TAGS}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.resolve_tags.outputs.tags }}
