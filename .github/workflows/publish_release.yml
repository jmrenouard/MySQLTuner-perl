name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and Attach Deliverables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          cp mysqltuner.pl dist/
          cp vulnerabilities.csv dist/
          cp basic_passwords.txt dist/
          tar -czvf "dist/mysqltuner-${{ github.ref_name }}.tar.gz" mysqltuner.pl vulnerabilities.csv basic_passwords.txt LICENSE README.md
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
