name: Documentation CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".markdownlint.json"
      - ".vale.ini"
      - "build/mkdocs_hooks.py"
      - "build/check_diataxis_docs.py"
      - "build/docs_htaccess"
      - ".github/workflows/docs-ci.yml"
      - "releases/**"
      - "CURRENT_VERSION.txt"
      - "mysql_support.md"
      - "mariadb_support.md"
      - "FEATURES.md"
      - "USAGE.md"
      - "SECURITY.md"
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".markdownlint.json"
      - ".vale.ini"
      - "build/mkdocs_hooks.py"
      - "build/check_diataxis_docs.py"
      - "build/docs_htaccess"
      - ".github/workflows/docs-ci.yml"
      - "releases/**"
      - "CURRENT_VERSION.txt"
      - "mysql_support.md"
      - "mariadb_support.md"
      - "FEATURES.md"
      - "USAGE.md"
      - "SECURITY.md"
  workflow_dispatch:

jobs:
  docs-quality:
    name: Validate Diataxis, STE, Markdownlint, and MkDocs Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Run Diataxis and STE validator
        run: python3 build/check_diataxis_docs.py docs --strict

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19
        with:
          globs: |
            docs/**/*.md
          config: .markdownlint.json

      - name: Build MkDocs site in strict mode
        run: mkdocs build --strict

      - name: Run MkDocs Diataxis unit tests
        run: prove -v tests/unit_mkdocs_diataxis.t
