name: Documentation CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".markdownlint.json"
      - ".vale.ini"
      - "build/mkdocs_hooks.py"
      - "build/check_diataxis_docs.py"
      - "build/docs_htaccess"
      - ".vale/**"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/docs-deploy.yml"
      - "tests/unit_mkdocs_diataxis.t"
      - "tests/unit_docs_tutorials_howtos.t"
      - "tests/unit_docs_tutorials_howtos.py"
      - "releases/**"
      - "CURRENT_VERSION.txt"
      - "mysql_support.md"
      - "mariadb_support.md"
      - "FEATURES.md"
      - "USAGE.md"
      - "SECURITY.md"
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".markdownlint.json"
      - ".vale.ini"
      - "build/mkdocs_hooks.py"
      - "build/check_diataxis_docs.py"
      - "build/docs_htaccess"
      - ".vale/**"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/docs-deploy.yml"
      - "tests/unit_mkdocs_diataxis.t"
      - "tests/unit_docs_tutorials_howtos.t"
      - "tests/unit_docs_tutorials_howtos.py"
      - "releases/**"
      - "CURRENT_VERSION.txt"
      - "mysql_support.md"
      - "mariadb_support.md"
      - "FEATURES.md"
      - "USAGE.md"
      - "SECURITY.md"
  workflow_dispatch:

jobs:
  docs-quality:
    name: Validate Structure, Links, Style, and MkDocs Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Run documentation structure, link, and style validator
        run: python3 build/check_diataxis_docs.py docs --strict --mkdocs-config mkdocs.yml

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19
        with:
          globs: |
            docs/**/*.md
          config: .markdownlint.json

      - name: Run Vale prose linter
        uses: vale-cli/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2
        with:
          files: docs
          fail_on_error: true

      - name: Build MkDocs site in strict mode
        run: mkdocs build --strict

      - name: Run documentation unit tests
        run: prove -v tests/unit_mkdocs_diataxis.t tests/unit_docs_tutorials_howtos.t
